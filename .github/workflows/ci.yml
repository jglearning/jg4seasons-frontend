name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# PR은 새 커밋이 오면 이전 실행을 취소한다. main은 배포와 이어지므로 취소하지 않는다
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:cloudfront
      - run: npm run build

      # 배포 잡이 올리는 것은 검사를 지난 바로 이 빌드다
      - name: Upload build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # 운영: CloudFront + 비공개 S3. /api/*·/audio/*는 같은 배포의 다른 동작이다
  deploy:
    needs: check
    # 환경 production도 main만 허용한다(둘 중 하나가 풀려도 다른 쪽이 막는다)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # 배포는 하나씩. 앞의 배포를 취소하지 않는다
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      BUCKET: ${{ vars.WEB_BUCKET }}
      SITE_URL: https://www.jg4seasons.com
    steps:
      # OIDC 토큰을 받는 잡이라 액션을 태그 대신 커밋으로 고정한다(태그는 옮길 수 있다)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: dist

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 새 파일을 먼저 올리고, index.html을 바꾼 뒤, 지난 파일을 지운다.
      # 순서가 바뀌면 새 index.html이 아직 없는 파일을 가리키는 순간이 생긴다.
      # 지난 assets는 지우지 않는다(배포 전에 연 탭이 옛 화면 파일을 받을 수 있게)
      - name: Upload assets
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" \
            --cache-control "public, max-age=31536000, immutable"

      # 이름에 해시가 없는 파일(index.html, 파비콘)은 새 배포가 바로 보이게 캐시하지 않는다.
      # mockServiceWorker.js는 개발용(npm run dev:mock)이라 올리지 않는다
      - name: Upload index.html
        run: |
          aws s3 cp dist "s3://$BUCKET" --recursive \
            --exclude "assets/*" --exclude "mockServiceWorker.js" \
            --cache-control "no-cache"

      - name: Delete old files
        run: |
          aws s3 sync dist "s3://$BUCKET" --delete \
            --exclude "assets/*" --exclude "mockServiceWorker.js" \
            --cache-control "no-cache"

      # 앱 경로는 CloudFront Function이 모두 /index.html로 바꾸므로 이것 하나만 무효화한다
      - name: Invalidate index.html
        run: |
          aws cloudfront create-invalidation --distribution-id "${{ vars.DISTRIBUTION_ID }}" \
            --paths /index.html --query Invalidation.Id --output text

      # 역할에 무효화 상태를 읽는 권한은 없다. 대신 실제 주소가 이번 빌드의 index.html을 줄 때까지 본다
      - name: Check live site
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "$SITE_URL/" | cmp -s - dist/index.html; then
              echo "live: $SITE_URL serves this build"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$SITE_URL still serves another index.html after 5 minutes"
          exit 1
